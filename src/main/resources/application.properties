spring.application.name=spring-dsql
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://${DSQL_HOST}:5432/postgres?sslmode=verify-full
spring.datasource.username=${DSQL_USER:admin}
spring.datasource.password=${DSQL_TOKEN}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslrootcert=${DSQL_SSLROOTCERT}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
